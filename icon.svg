<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="#FC4C02"/>

  <!-- Gauge arc (background track) -->
  <path d="M 24 88 A 44 44 0 1 1 104 88" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="10" stroke-linecap="round"/>

  <!-- Gauge arc (power fill ~70%) -->
  <path d="M 24 88 A 44 44 0 1 1 95 52" fill="none" stroke="white" stroke-width="10" stroke-linecap="round"/>

  <!-- Center needle -->
  <line x1="64" y1="64" x2="95" y2="52" stroke="white" stroke-width="4" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="64" cy="64" r="6" fill="white"/>

  <!-- Bolt / power symbol at bottom -->
  <text x="64" y="112" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="rgba(255,255,255,0.8)" text-anchor="middle">POWER</text>
</svg>
